name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  python:
    name: Python syntax check & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: dashboard/web
        run: |
          npm ci
          npm run build

      - name: Compile all Python files
        run: |
          python3 -m py_compile dashboard/server.py
          python3 -m py_compile dashboard/sync_remote.py
          python3 -m py_compile deploy.py
          python3 -m py_compile devin

      - name: Verify server starts
        run: |
          cd dashboard
          python3 server.py &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:7841/api/overview?period=7d > /dev/null && echo "API OK"
          curl -sf http://127.0.0.1:7841/api/models?period=7d > /dev/null && echo "Models OK"
          kill $SERVER_PID 2>/dev/null || true

  cross-platform:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python files (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m py_compile dashboard/server.py
          python3 -m py_compile dashboard/sync_remote.py
          python3 -m py_compile deploy.py
          python3 -m py_compile devin

      - name: Compile Python files (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m py_compile dashboard/server.py
          python -m py_compile dashboard/sync_remote.py
          python -m py_compile deploy.py
          python -m py_compile devin

      - name: Deploy script help
        run: python3 deploy.py --help || python deploy.py --help
